<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <rect width="600" height="400" fill="#323236"/>

  <!-- Stacked coins (left) - the "visible price" -->
  <g transform="translate(120, 240)">
    <ellipse cx="50" cy="6" rx="50" ry="14" fill="#F5F5F0" opacity="0.18"/>
    <rect x="0" y="-14" width="100" height="20" fill="#F5F5F0" opacity="0.18"/>
    <ellipse cx="50" cy="-14" rx="50" ry="14" fill="#F5F5F0" opacity="0.32"/>
  </g>

  <!-- Tall hidden stack (right) - the "real price" -->
  <g transform="translate(360, 110)">
    <!-- Stack of 6 coins -->
    <g opacity="0.32">
      <ellipse cx="50" cy="140" rx="50" ry="14" fill="#F5F5F0"/>
      <rect x="0" y="120" width="100" height="20" fill="#F5F5F0"/>
      <ellipse cx="50" cy="120" rx="50" ry="14" fill="#F5F5F0" opacity="1"/>
    </g>
    <g opacity="0.42">
      <rect x="0" y="100" width="100" height="20" fill="#F5F5F0"/>
      <ellipse cx="50" cy="100" rx="50" ry="14" fill="#F5F5F0"/>
    </g>
    <g opacity="0.52">
      <rect x="0" y="80" width="100" height="20" fill="#F5F5F0"/>
      <ellipse cx="50" cy="80" rx="50" ry="14" fill="#F5F5F0"/>
    </g>
    <g opacity="0.62">
      <rect x="0" y="60" width="100" height="20" fill="#F5F5F0"/>
      <ellipse cx="50" cy="60" rx="50" ry="14" fill="#F5F5F0"/>
    </g>
    <g opacity="0.72">
      <rect x="0" y="40" width="100" height="20" fill="#F5F5F0"/>
      <ellipse cx="50" cy="40" rx="50" ry="14" fill="#F5F5F0"/>
    </g>
    <g opacity="0.85">
      <rect x="0" y="20" width="100" height="20" fill="#F5F5F0"/>
      <ellipse cx="50" cy="20" rx="50" ry="14" fill="#F5F5F0"/>
    </g>
    <ellipse cx="50" cy="0" rx="50" ry="14" fill="#F5F5F0" opacity="0.95"/>
  </g>

  <!-- Arrow between -->
  <g transform="translate(245, 220)" stroke="#F5F5F0" stroke-width="3" stroke-opacity="0.45" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 30 L70 30"/>
    <path d="M58 18 L70 30 L58 42"/>
  </g>

  <!-- Dollar sign on the tall stack -->
  <text x="410" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="34" font-weight="700" fill="#27272A" opacity="0.85">$</text>

  <!-- Label -->
  <text x="300" y="370" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#F5F5F0" opacity="0.55">Dolda kostnader</text>
</svg>
