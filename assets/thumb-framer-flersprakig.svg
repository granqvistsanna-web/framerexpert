  <ellipse cx="300" cy="160" rx="26" ry="60" fill="none" stroke="#F5F5F0" stroke-width="2" stroke-opacity="0.3"/>
  <line x1="240" y1="160" x2="360" y2="160" stroke="#F5F5F0" stroke-width="2" stroke-opacity="0.3"/>
  <line x1="249" y1="128" x2="351" y2="128" stroke="#F5F5F0" stroke-width="2" stroke-opacity="0.22"/>
  <line x1="249" y1="192" x2="351" y2="192" stroke="#F5F5F0" stroke-width="2" stroke-opacity="0.22"/>

  <!-- Language pill: SV / EN -->
