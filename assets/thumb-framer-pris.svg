    <path d="M210 150 H360 a20 20 0 0 1 20 20 v60 a20 20 0 0 1 -20 20 H210 l-40 -50 z" fill="#3F3F46"/>
    <circle cx="205" cy="200" r="9" fill="#323236"/>
    <circle cx="205" cy="200" r="4" fill="#F5F5F0" opacity="0.4"/>
    <!-- kr amount -->
    <rect x="240" y="185" width="70" height="12" rx="6" fill="#F5F5F0" opacity="0.75"/>
    <rect x="240" y="205" width="110" height="8" rx="4" fill="#F5F5F0" opacity="0.25"/>
  </g>

  <!-- Coins stack -->
