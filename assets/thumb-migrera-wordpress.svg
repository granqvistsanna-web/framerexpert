<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <rect width="600" height="400" fill="#323236"/>

  <!-- Left panel: WordPress (W) -->
  <rect x="80" y="125" width="140" height="140" rx="18" fill="#3F3F46" opacity="0.75"/>
  <text x="150" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="60" font-weight="700" fill="#F5F5F0" opacity="0.45">W</text>

  <!-- Arrow -->
  <line x1="240" y1="195" x2="350" y2="195" stroke="#F5F5F0" stroke-width="3" stroke-opacity="0.4" stroke-linecap="round"/>
  <path d="M334 178 L354 195 L334 212" stroke="#F5F5F0" stroke-width="3" stroke-opacity="0.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right panel: Framer (F) -->
