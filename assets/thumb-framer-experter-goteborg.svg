<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <rect width="600" height="400" fill="#323236"/>

  <!-- Small map pin marker indicating a city focus -->
  <circle cx="300" cy="58" r="6" fill="#F5F5F0" opacity="0.55"/>
  <rect x="280" y="56" width="40" height="4" rx="2" fill="#F5F5F0" opacity="0.18"/>

  <!-- Top card: highlighted expert (rank 1) -->
  <rect x="120" y="96" width="360" height="72" rx="12" fill="#3F3F46"/>
  <circle cx="156" cy="132" r="20" fill="#F5F5F0" opacity="0.85"/>
  <rect x="190" y="116" width="160" height="8" rx="4" fill="#F5F5F0" opacity="0.75"/>
  <rect x="190" y="132" width="220" height="6" rx="3" fill="#F5F5F0" opacity="0.3"/>
  <rect x="190" y="146" width="120" height="6" rx="3" fill="#F5F5F0" opacity="0.2"/>
  <!-- Star badge -->
  <circle cx="440" cy="132" r="16" fill="#F5F5F0" opacity="0.18"/>
  <path d="M440 123 L443 130 L450 131 L445 136 L446 143 L440 140 L434 143 L435 136 L430 131 L437 130 Z" fill="#F5F5F0" opacity="0.85"/>

  <!-- Card 2 -->
  <rect x="120" y="184" width="360" height="52" rx="10" fill="#3F3F46" opacity="0.85"/>
  <circle cx="150" cy="210" r="14" fill="#F5F5F0" opacity="0.55"/>
  <rect x="176" y="200" width="140" height="7" rx="3" fill="#F5F5F0" opacity="0.5"/>
  <rect x="176" y="214" width="200" height="5" rx="2" fill="#F5F5F0" opacity="0.18"/>

  <!-- Card 3 -->
  <rect x="120" y="248" width="360" height="52" rx="10" fill="#3F3F46" opacity="0.55"/>
  <circle cx="150" cy="274" r="14" fill="#F5F5F0" opacity="0.4"/>
  <rect x="176" y="264" width="120" height="7" rx="3" fill="#F5F5F0" opacity="0.38"/>
  <rect x="176" y="278" width="180" height="5" rx="2" fill="#F5F5F0" opacity="0.14"/>

  <!-- Card 4 (greyer — fewer experts in a smaller city) -->
  <rect x="120" y="312" width="360" height="44" rx="10" fill="#3F3F46" opacity="0.32"/>
  <circle cx="150" cy="334" r="12" fill="#F5F5F0" opacity="0.2"/>
  <rect x="176" y="328" width="100" height="6" rx="3" fill="#F5F5F0" opacity="0.18"/>
  <rect x="176" y="340" width="160" height="4" rx="2" fill="#F5F5F0" opacity="0.08"/>
</svg>
