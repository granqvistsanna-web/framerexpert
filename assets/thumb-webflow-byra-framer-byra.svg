<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <rect width="600" height="400" fill="#323236"/>

  <!-- Left card: Framer-byrå (highlighted) -->
  <rect x="80" y="100" width="200" height="200" rx="20" fill="#3F3F46"/>
  <text x="180" y="178" text-anchor="middle" font-family="system-ui, sans-serif" font-size="44" font-weight="700" fill="#F5F5F0">F</text>
  <text x="180" y="218" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#F5F5F0" opacity="0.85">Framer-byrå</text>
  <rect x="120" y="240" width="120" height="6" rx="3" fill="#F5F5F0" opacity="0.4"/>
  <rect x="130" y="256" width="100" height="6" rx="3" fill="#F5F5F0" opacity="0.25"/>
  <rect x="140" y="272" width="80" height="6" rx="3" fill="#F5F5F0" opacity="0.18"/>

  <!-- vs -->
  <text x="300" y="208" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="500" fill="#71717A">vs</text>

  <!-- Right card: Webflow-byrå (dimmed) -->
  <rect x="320" y="100" width="200" height="200" rx="20" fill="#3F3F46" opacity="0.7"/>
  <text x="420" y="178" text-anchor="middle" font-family="system-ui, sans-serif" font-size="44" font-weight="700" fill="#F5F5F0" opacity="0.75">Wf</text>
  <text x="420" y="218" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#F5F5F0" opacity="0.6">Webflow-byrå</text>
  <rect x="360" y="240" width="120" height="6" rx="3" fill="#F5F5F0" opacity="0.28"/>
  <rect x="370" y="256" width="100" height="6" rx="3" fill="#F5F5F0" opacity="0.18"/>
  <rect x="380" y="272" width="80" height="6" rx="3" fill="#F5F5F0" opacity="0.12"/>
</svg>
