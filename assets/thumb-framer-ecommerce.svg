<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <rect width="600" height="400" fill="#323236"/>

  <!-- Product card -->
  <rect x="120" y="90" width="200" height="220" rx="14" fill="#3F3F46"/>
  <rect x="138" y="108" width="164" height="130" rx="8" fill="#F5F5F0" opacity="0.2"/>
  <rect x="138" y="250" width="110" height="8" rx="4" fill="#F5F5F0" opacity="0.6"/>
  <rect x="138" y="266" width="70" height="6" rx="3" fill="#F5F5F0" opacity="0.3"/>
  <rect x="138" y="282" width="60" height="14" rx="4" fill="#F5F5F0" opacity="0.75"/>

  <!-- Shopping cart icon (right side) -->
  <g transform="translate(360, 140)" stroke="#F5F5F0" stroke-width="4" stroke-opacity="0.55" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 10 L20 10 L36 78 L112 78 L126 30 L26 30"/>
    <circle cx="48" cy="104" r="10"/>
    <circle cx="102" cy="104" r="10"/>
  </g>

  <!-- Price tag -->
  <g transform="translate(390, 230)">
    <rect x="0" y="0" width="110" height="44" rx="8" fill="#3F3F46"/>
    <circle cx="18" cy="22" r="5" fill="#F5F5F0" opacity="0.45"/>
    <rect x="36" y="13" width="56" height="8" rx="4" fill="#F5F5F0" opacity="0.75"/>
    <rect x="36" y="27" width="42" height="6" rx="3" fill="#F5F5F0" opacity="0.35"/>
  </g>

  <!-- Label -->
  <text x="300" y="360" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#F5F5F0" opacity="0.55">E-handel</text>
</svg>
