<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{META_TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">

  <!-- Open Graph -->
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{OG_DESCRIPTION}}">
  <meta property="og:url" content="https://framerexpert.se/blog/{{SLUG}}.html">
  <meta property="og:type" content="article">
  <meta property="og:locale" content="sv_SE">
  <meta property="article:published_time" content="{{DATE}}">
  <meta property="article:modified_time" content="{{DATE_MODIFIED}}">
  <meta property="article:author" content="FramerExpert">
  <meta property="og:image" content="https://framerexpert.se/assets/{{OG_IMAGE}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://framerexpert.se/assets/{{OG_IMAGE}}">

  <!-- Canonical -->
  <link rel="canonical" href="https://framerexpert.se/blog/{{SLUG}}.html">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="https://unpkg.com/lenis@1.3.17/dist/lenis.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/animations.css">

  <!-- JSON-LD -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BlogPosting",
    "headline": {{JSON_TITLE}},
    "description": {{JSON_DESCRIPTION}},
    "datePublished": "{{DATE}}",
    "dateModified": "{{DATE_MODIFIED}}",
    "author": {
      "@type": "Organization",
      "name": "FramerExpert",
      "url": "https://framerexpert.se"
    },
    "publisher": {
      "@type": "Organization",
      "name": "FramerExpert.se",
      "url": "https://framerexpert.se"
    },
    "mainEntityOfPage": "https://framerexpert.se/blog/{{SLUG}}.html",
    "inLanguage": "sv"
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      { "@type": "ListItem", "position": 1, "name": "Hem", "item": "https://framerexpert.se" },
      { "@type": "ListItem", "position": 2, "name": "Blogg", "item": "https://framerexpert.se/blog/" },
      { "@type": "ListItem", "position": 3, "name": {{JSON_TITLE}} }
    ]
  }
  </script>
{{FAQ_SCHEMA}}</head>
<body data-page="{{PAGE_ID}}">

  <!-- NAVIGATION -->
  <nav data-twostep-nav data-nav-status="not-active" class="twostep-nav">
    <div data-nav-toggle="close" class="twostep-nav__bg"></div>
    <div class="twostep-nav__wrap">
      <div class="twostep-nav__width">
        <div class="twostep-nav__bar">
          <div class="twostep-nav__back">
            <div class="twostep-nav__back-bg"></div>
          </div>
          <div class="twostep-nav__top">
            <a href="/" class="twostep-nav__logo">
              framer.expert
            </a>
            <button data-nav-toggle="toggle" class="twostep-nav__toggle" aria-label="Öppna meny" aria-expanded="false">
              <div class="twostep-nav__toggle-bar"></div>
              <div class="twostep-nav__toggle-bar"></div>
            </button>
            <div class="twostep-nav__top-line"></div>
          </div>
          <div class="twostep-nav__bottom">
            <div class="twostep-nav__bottom-overflow">
              <div class="twostep-nav__bottom-inner">
                <div class="twostep-nav__bottom-row">
                  <div class="twostep-nav__bottom-col">
                    <div class="twostep-nav__info">
                      <ul class="twostep-nav__ul">
                        <li class="twostep-nav__li">
                          <a href="/blog/" class="twostep-nav__link" data-nav-toggle="close"><span class="twostep-nav__link-span" data-i18n="nav.blog">Blogg</span></a>
                        </li>
                      </ul>
                      <ul class="twostep-nav__ul is--small">
                        <li class="twostep-nav__li">
                          <a href="/blog/?category=getting-started" class="twostep-nav__link" data-nav-toggle="close"><span class="twostep-nav__link-eyebrow" data-i18n="blog.filter.getting-started">Kom igång</span></a>
                        </li>
                        <li class="twostep-nav__li">
                          <a href="/blog/?category=comparison" class="twostep-nav__link" data-nav-toggle="close"><span class="twostep-nav__link-eyebrow" data-i18n="blog.filter.comparison">Jämförelse</span></a>
                        </li>
                        <li class="twostep-nav__li">
                          <a href="/blog/?category=tips" class="twostep-nav__link" data-nav-toggle="close"><span class="twostep-nav__link-eyebrow" data-i18n="blog.filter.tips">Tips</span></a>
                        </li>
                        <li class="twostep-nav__li">
                          <a href="/blog/?category=seo" class="twostep-nav__link" data-nav-toggle="close"><span class="twostep-nav__link-eyebrow" data-i18n="blog.filter.seo">SEO</span></a>
                        </li>
                        <li class="twostep-nav__li">
                          <a href="/blog/?category=cms" class="twostep-nav__link" data-nav-toggle="close"><span class="twostep-nav__link-eyebrow" data-i18n="blog.filter.cms">CMS</span></a>
                        </li>
                        <li class="twostep-nav__li">
                          <a href="https://www.framer.com" target="_blank" rel="noopener" class="twostep-nav__link"><span class="twostep-nav__link-eyebrow">Framer.com</span></a>
                        </li>
                      </ul>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <main>

  <!-- BREADCRUMBS -->
  <div class="breadcrumbs container">
    <ol class="breadcrumbs__list">
      <li><a href="/" data-i18n="nav.home">Hem</a></li>
      <li><a href="/blog/" data-i18n="nav.blog">Blogg</a></li>
      <li><span aria-current="page">{{TITLE}}</span></li>
    </ol>
  </div>

  <!-- ARTICLE -->
  <article class="container">
    <header class="blog-post__header">
      <div class="blog-post__meta">
        <span class="blog-post__category">{{CATEGORY_LABEL}}</span>
        <time datetime="{{DATE}}">{{DATE_DISPLAY}}</time>
        <span>{{READTIME}}</span>
      </div>
      <h1 class="blog-post__title">{{TITLE}}</h1>
      <p class="blog-post__intro">{{INTRO}}</p>
    </header>

    <div class="blog-post__content">
{{BODY}}
    </div>

    <!-- Related Articles -->
    <aside class="blog-post__related">
      <h2 class="blog-post__related-title" data-i18n="post.related">Relaterade artiklar</h2>
      <div class="blog-post__related-grid">
{{RELATED}}
      </div>
    </aside>
  </article>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container footer__inner">
      <span class="footer__left">&copy; <span data-current-year>2026</span> FramerExpert.se</span>
      <div class="footer__links">
        <button class="lang-toggle" id="langToggle" aria-label="Byt språk">
          <span class="lang-toggle__option is-active" data-lang="sv">SV</span>
          <span class="lang-toggle__divider">/</span>
          <span class="lang-toggle__option" data-lang="en">EN</span>
        </button>
      </div>
    </div>
  </footer>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/lenis@1.3.17/dist/lenis.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/CustomEase.min.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/init.js"></script>
</body>
</html>
