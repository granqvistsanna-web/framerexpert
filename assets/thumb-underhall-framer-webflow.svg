<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <rect width="600" height="400" fill="#323236"/>

  <!-- Left panel: Framer (F) -->
  <rect x="96" y="120" width="150" height="150" rx="18" fill="#3F3F46"/>
  <text x="171" y="215" text-anchor="middle" font-family="system-ui, sans-serif" font-size="70" font-weight="700" fill="#F5F5F0" opacity="0.7">F</text>

  <!-- Maintenance gear, centered -->
  <circle cx="300" cy="195" r="30" fill="none" stroke="#F5F5F0" stroke-width="3" stroke-opacity="0.4"/>
  <circle cx="300" cy="195" r="10" fill="none" stroke="#F5F5F0" stroke-width="3" stroke-opacity="0.4"/>
  <line x1="300" y1="155" x2="300" y2="167" stroke="#F5F5F0" stroke-width="4" stroke-opacity="0.4" stroke-linecap="round"/>
  <line x1="300" y1="223" x2="300" y2="235" stroke="#F5F5F0" stroke-width="4" stroke-opacity="0.4" stroke-linecap="round"/>
  <line x1="260" y1="195" x2="272" y2="195" stroke="#F5F5F0" stroke-width="4" stroke-opacity="0.4" stroke-linecap="round"/>
  <line x1="328" y1="195" x2="340" y2="195" stroke="#F5F5F0" stroke-width="4" stroke-opacity="0.4" stroke-linecap="round"/>

  <!-- Right panel: Webflow (W) -->
  <rect x="354" y="120" width="150" height="150" rx="18" fill="#3F3F46" opacity="0.75"/>
  <text x="429" y="215" text-anchor="middle" font-family="system-ui, sans-serif" font-size="60" font-weight="700" fill="#F5F5F0" opacity="0.45">W</text>

  <!-- Label -->
  <text x="300" y="320" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#F5F5F0" opacity="0.55">Underhåll</text>
</svg>
