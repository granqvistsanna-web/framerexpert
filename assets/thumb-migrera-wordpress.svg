  <text x="455" y="215" text-anchor="middle" font-family="system-ui, sans-serif" font-size="70" font-weight="700" fill="#F5F5F0" opacity="0.7">F</text>

  <!-- Label -->
  <text x="300" y="320" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#F5F5F0" opacity="0.55">Migrera till Framer</text>
</svg>
